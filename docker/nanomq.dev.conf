# NanoMQ for development, checking logins with the app running on the host at port 2070.
# Same as rootfs/etc/nanomq.conf (see there for why) except for the app's address.

system {
	num_taskq_thread = 16
	max_taskq_thread = 16
	parallel = 8
}

listeners.tcp {
	bind = "0.0.0.0:1883"
}

log {
	to = [console]
	level = warn
}

auth {
	allow_anonymous = false

	http_auth {
		auth_req {
			url = "http://host.docker.internal:2070/api/mqtt/authenticate"
			method = post
			headers.content-type = "application/json"
			params = {clientid = "%c", username = "%u", password = "%P"}
		}
		acl_req {
			url = "http://host.docker.internal:2070/api/mqtt/authorize"
			method = post
			headers.content-type = "application/json"
			params = {username = "%u", access = "%A", topic = "%t"}
		}
		timeout = 5s
		connect_timeout = 5s
		pool_size = 32
		cache_ttl = 1m
	}
}
