# NanoMQ for development, checking logins with the app running on the host at port 8080.
# Same as rootfs/etc/nanomq.conf (see there for why) except for the app's address, the REST API's login, and the number of
# parallel workers that the image sets when starting NanoMQ (see rootfs/etc/s6-overlay/s6-rc.d/nanomq/run).
# 2 leaves task threads free on any machine with 2 or more CPUs.

system {
	parallel = 2
}

listeners.tcp {
	bind = "0.0.0.0:1883"
}

# REST API with NanoMQ's default login admin/public, so only publish its port on the host's localhost
http_server {
	port = 8081
}

log {
	to = [console]
	level = warn
}

auth {
	allow_anonymous = false

	http_auth {
		auth_req {
			url = "http://host.docker.internal:8080/api/mqtt/authenticate"
			method = post
			headers.content-type = "application/json"
			params = {clientid = "%c", username = "%u", password = "%P", ipaddress = "%a"}
		}
		acl_req {
			url = "http://host.docker.internal:8080/api/mqtt/authorize"
			method = post
			headers.content-type = "application/json"
			params = {username = "%u", access = "%A", topic = "%t"}
		}
		timeout = 5s
		connect_timeout = 5s
		cache_ttl = 10m
	}
}
