# NanoMQ broker, see https://nanomq.io/docs/en/latest/config-description/introduction.html
# Logins and topic permissions are checked by the app, see app/src/endpoints/mqtt.py
# The number of parallel workers is set when starting NanoMQ, see s6-overlay/s6-rc.d/nanomq/run

listeners.tcp {
	bind = "0.0.0.0:1883"
}

# REST API for the app's MQ-broker page, see app/src/services/broker_service.py. It can also publish and stop the
# broker, so it only listens inside the container, as user admin with a password created at start (see s6-overlay/scripts/init-data)
http_server {
	ip_addr = "127.0.0.1"
	port = 8081
}

log {
	to = [console]
	level = warn
}

auth {
	allow_anonymous = false

	http_auth {
		auth_req {
			url = "http://127.0.0.1:8080/api/mqtt/authenticate"
			method = post
			headers.content-type = "application/json"
			params = {clientid = "%c", username = "%u", password = "%P", ipaddress = "%a"}
		}
		acl_req {
			url = "http://127.0.0.1:8080/api/mqtt/authorize"
			method = post
			headers.content-type = "application/json"
			params = {username = "%u", access = "%A", topic = "%t"}
		}
		timeout = 5s
		connect_timeout = 5s
		# allowed topics are remembered per client, and all of them are forgotten at once every cache_ttl
		cache_ttl = 10m
	}
}
