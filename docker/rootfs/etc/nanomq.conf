# NanoMQ broker, see https://nanomq.io/docs/en/latest/config-description/introduction.html
# Logins and topic permissions are checked by the app, see app/src/endpoints/mqtt.py

# Each message waiting for a topic permission check blocks a task thread until the HTTP request
# completes, and completing it needs a free task thread. The defaults (parallel = 2 x cpus,
# at most 16 threads) can block all of them on a burst of messages, timing out every check.
system {
	num_taskq_thread = 16
	max_taskq_thread = 16
	parallel = 8
}

listeners.tcp {
	bind = "0.0.0.0:1883"
}

log {
	to = [console]
	level = warn
}

auth {
	allow_anonymous = false

	http_auth {
		auth_req {
			url = "http://127.0.0.1:8080/api/mqtt/authenticate"
			method = post
			headers.content-type = "application/json"
			params = {clientid = "%c", username = "%u", password = "%P"}
		}
		acl_req {
			url = "http://127.0.0.1:8080/api/mqtt/authorize"
			method = post
			headers.content-type = "application/json"
			params = {username = "%u", access = "%A", topic = "%t"}
		}
		timeout = 5s
		connect_timeout = 5s
		pool_size = 32
		cache_ttl = 1m
	}
}
