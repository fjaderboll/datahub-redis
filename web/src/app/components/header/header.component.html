<mat-toolbar class="toolbar">
	<a mat-button routerLink="/" class="brand">
		<mat-icon class="logo" svgIcon="datahub" />
		<span class="title">Datahub</span>
	</a>

	@if (auth.isLoggedIn()) {
		<nav class="wide-only">
			<a mat-button routerLink="/datasets" routerLinkActive="active">
				<mat-icon fontIcon="dataset" />
				<span>Datasets</span>
			</a>

			<button mat-button [matMenuTriggerFor]="integrationMenu">
				<mat-icon fontIcon="swap_horiz" />
				<span>Integration</span>
			</button>

			@if (auth.isAdmin()) {
				<button mat-button [matMenuTriggerFor]="adminMenu">
					<mat-icon fontIcon="admin_panel_settings" />
					<span>Administration</span>
				</button>
			}
		</nav>

		<span class="spacer"></span>

		<a mat-button class="wide-only username" routerLink="/users/{{ auth.getUsername() }}" routerLinkActive="active">
			<mat-icon fontIcon="person" />
			<span>{{ auth.getUsername() }}</span>
		</a>

		<button mat-button class="wide-only" (click)="logout()">
			<mat-icon fontIcon="lock_open" />
			<span>Sign out</span>
		</button>

		<button mat-icon-button class="narrow-only" [matMenuTriggerFor]="mainMenu" aria-label="Menu">
			<mat-icon fontIcon="menu" />
		</button>
	}
</mat-toolbar>

<mat-menu #integrationMenu="matMenu">
	<a mat-menu-item routerLink="/tokens">
		<mat-icon fontIcon="key" />
		<span>Tokens</span>
	</a>
	<a mat-menu-item [href]="apiUrl" target="_blank" rel="noopener">
		<mat-icon svgIcon="swagger" />
		<span>
			Swagger
			<mat-icon class="tiny" fontIcon="open_in_new" />
		</span>
	</a>
	<a mat-menu-item [href]="docUrl" target="_blank" rel="noopener">
		<mat-icon fontIcon="description" />
		<span>
			Documentation
			<mat-icon class="tiny" fontIcon="open_in_new" />
		</span>
	</a>
</mat-menu>

<mat-menu #adminMenu="matMenu">
	<a mat-menu-item routerLink="/users">
		<mat-icon fontIcon="people" />
		<span>Users</span>
	</a>
	<a mat-menu-item routerLink="/timeseries">
		<mat-icon fontIcon="history" />
		<span>Timeseries</span>
	</a>
	<a mat-menu-item routerLink="/settings">
		<mat-icon fontIcon="settings" />
		<span>Settings</span>
	</a>
</mat-menu>

<!-- everything in one menu on narrow screens -->
<mat-menu #mainMenu="matMenu" xPosition="before">
	<a mat-menu-item routerLink="/datasets">
		<mat-icon fontIcon="dataset" />
		<span>Datasets</span>
	</a>
	<a mat-menu-item routerLink="/tokens">
		<mat-icon fontIcon="key" />
		<span>Tokens</span>
	</a>
	<a mat-menu-item [href]="apiUrl" target="_blank" rel="noopener">
		<mat-icon svgIcon="swagger" />
		<span>Swagger</span>
	</a>
	<a mat-menu-item [href]="docUrl" target="_blank" rel="noopener">
		<mat-icon fontIcon="description" />
		<span>Documentation</span>
	</a>

	@if (auth.isAdmin()) {
		<mat-divider />
		<a mat-menu-item routerLink="/users">
			<mat-icon fontIcon="people" />
			<span>Users</span>
		</a>
		<a mat-menu-item routerLink="/timeseries">
			<mat-icon fontIcon="history" />
			<span>Timeseries</span>
		</a>
		<a mat-menu-item routerLink="/settings">
			<mat-icon fontIcon="settings" />
			<span>Settings</span>
		</a>
	}

	<mat-divider />
	<a mat-menu-item routerLink="/users/{{ auth.getUsername() }}">
		<mat-icon fontIcon="person" />
		<span>{{ auth.getUsername() }}</span>
	</a>
	<button mat-menu-item (click)="logout()">
		<mat-icon fontIcon="lock_open" />
		<span>Sign out</span>
	</button>
</mat-menu>
