<form class="dialog-form" #form="ngForm" (ngSubmit)="form.valid && !busy && share()">
	<h1 mat-dialog-title>Share dataset</h1>
	<mat-dialog-content>
		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Username</mat-label>
			<input type="text" matInput required name="username" [pattern]="namePattern" [(ngModel)]="username" autocomplete="off" autocapitalize="none">
			<mat-error>Not a valid username</mat-error>
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button type="button" mat-stroked-button color="primary" [mat-dialog-close]="false">
			<mat-icon>close</mat-icon>
			<span>Cancel</span>
		</button>
		<button type="submit" mat-flat-button color="accent" [disabled]="busy">
			<mat-icon>person_add</mat-icon>
			<span>Share with</span>
		</button>
	</mat-dialog-actions>
</form>
