<h1 mat-dialog-title>Visualize: {{ getTitle() }}</h1>
<mat-dialog-content>
	<div class="readings-chart" [appChart]="readingsChart"></div>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-stroked-button color="primary" [mat-dialog-close]="false">
		<mat-icon>close</mat-icon>
		<span>Close</span>
	</button>
	<button mat-flat-button color="primary" (click)="loadMore()" [disabled]="loading">
		@if (loading) {
			<mat-icon svgIcon="loading" />
		} @else {
			<mat-icon>downloading</mat-icon>
		}
		<span>Load next {{ utils.getDeltaTime(-after*1000) }}</span>
	</button>
</mat-dialog-actions>
