<form class="dialog-form" #form="ngForm" (ngSubmit)="form.valid && password1 == password2 && !busy && create()">
	<h1 mat-dialog-title>Create User</h1>
	<mat-dialog-content>
		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Username</mat-label>
			<input type="text" matInput required name="username" [pattern]="namePattern" [(ngModel)]="username" autocomplete="username" autocapitalize="none">
			<mat-hint>Lowercase letters, digits and _ - . &#64;</mat-hint>
			<mat-error>Lowercase letters, digits and _ - . &#64;</mat-error>
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Password</mat-label>
			<input [type]="showPassword ? 'text' : 'password'" matInput required name="password1" [(ngModel)]="password1" autocomplete="new-password">
			<button type="button" mat-icon-button matSuffix (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
				<mat-icon>{{ showPassword ? 'visibility' : 'visibility_off' }}</mat-icon>
			</button>
		</mat-form-field>

		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Re-type password</mat-label>
			<input [type]="showPassword ? 'text' : 'password'" matInput required name="password2" [(ngModel)]="password2" autocomplete="new-password">
			@if (password2 && password1 != password2) {
				<mat-hint class="mismatch">Passwords don't match</mat-hint>
			}
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button type="button" mat-stroked-button color="primary" [mat-dialog-close]="false">
			<mat-icon>close</mat-icon>
			<span>Cancel</span>
		</button>
		<button type="submit" mat-flat-button color="accent" [disabled]="busy">
			<mat-icon>person_add</mat-icon>
			<span>Create</span>
		</button>
	</mat-dialog-actions>
</form>
