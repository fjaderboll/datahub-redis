<h1 mat-dialog-title>{{ data.title }}</h1>
<mat-dialog-content>
	<div>
		{{ data.text }}
	</div>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-stroked-button color="primary" [mat-dialog-close]="false">
		<mat-icon>close</mat-icon>
		<span>Cancel</span>
	</button>
	<button mat-flat-button color="warn" (click)="apply()" [disabled]="busy">
		<mat-icon>check</mat-icon>
		<span>Proceed</span>
	</button>
</mat-dialog-actions>
