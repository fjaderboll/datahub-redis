<form class="dialog-form" #form="ngForm" (ngSubmit)="form.valid && !busy && create()">
	<h1 mat-dialog-title>Create Reading</h1>
	<mat-dialog-content>
		<mat-form-field appearance="outline">
			<mat-label>Value</mat-label>
			<input type="number" inputmode="decimal" matInput required name="value" [(ngModel)]="value" autocomplete="off">
		</mat-form-field>

		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Time</mat-label>
			<input type="text" matInput name="time" [(ngModel)]="time" placeholder="Now" autocomplete="off">
			<mat-hint>ISO timestamp, or seconds relative to now, e.g. -3600</mat-hint>
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button type="button" mat-stroked-button color="primary" [mat-dialog-close]="false">
			<mat-icon>close</mat-icon>
			<span>Cancel</span>
		</button>
		<button type="submit" mat-flat-button color="accent" [disabled]="busy">
			<mat-icon>add</mat-icon>
			<span>Create</span>
		</button>
	</mat-dialog-actions>
</form>
