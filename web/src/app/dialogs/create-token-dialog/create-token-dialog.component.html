<form class="dialog-form" #form="ngForm" (ngSubmit)="form.valid && !busy && create()">
	<h1 mat-dialog-title>Create Token</h1>
	<mat-dialog-content>
		<mat-form-field appearance="outline">
			<mat-label>Description</mat-label>
			<input type="text" matInput name="description" [(ngModel)]="description" autocomplete="off">
		</mat-form-field>

		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Time-To-Live</mat-label>
			<input type="number" inputmode="numeric" min="0" matInput name="ttl" [(ngModel)]="ttl" autocomplete="off">
			<span matTextSuffix>seconds</span>
			@if (ttl) {
				<mat-hint>Expires in {{ utils.printDuration(ttl, '') }}</mat-hint>
			} @else {
				<mat-hint>Leave empty to never expire</mat-hint>
			}
			<mat-error>Cannot be negative</mat-error>
		</mat-form-field>

		<mat-checkbox name="mqttOnly" [(ngModel)]="mqttOnly">MQTT only (not for the REST API)</mat-checkbox>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button type="button" mat-stroked-button color="primary" [mat-dialog-close]="false">
			<mat-icon>close</mat-icon>
			<span>Cancel</span>
		</button>
		<button type="submit" mat-flat-button color="accent" [disabled]="busy">
			<mat-icon>add</mat-icon>
			<span>Create</span>
		</button>
	</mat-dialog-actions>
</form>
