<form class="dialog-form" #form="ngForm" (ngSubmit)="form.valid && !busy && create()">
	<h1 mat-dialog-title>Create Dataset</h1>
	<mat-dialog-content>
		<mat-form-field appearance="outline" subscriptSizing="dynamic">
			<mat-label>Name</mat-label>
			<input type="text" matInput required name="name" [pattern]="namePattern" [(ngModel)]="name" autocomplete="off">
			<mat-hint>Lowercase letters, digits and _ - . &#64;</mat-hint>
			<mat-error>Lowercase letters, digits and _ - . &#64;</mat-error>
		</mat-form-field>

		<mat-form-field appearance="outline">
			<mat-label>Description</mat-label>
			<input type="text" matInput name="description" [(ngModel)]="description" autocomplete="off">
		</mat-form-field>
	</mat-dialog-content>
	<mat-dialog-actions>
		<button type="button" mat-stroked-button color="primary" [mat-dialog-close]="false">
			<mat-icon>close</mat-icon>
			<span>Cancel</span>
		</button>
		<button type="submit" mat-flat-button color="accent" [disabled]="busy">
			<mat-icon>add</mat-icon>
			<span>Create</span>
		</button>
	</mat-dialog-actions>
</form>
