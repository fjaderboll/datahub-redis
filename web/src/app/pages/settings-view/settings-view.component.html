<app-breadcrumb [links]="['/settings']" [names]="['Settings']" />

<dl class="list">
	<dt>Default retention</dt>
	<dd>
		<app-inline-edit type="number" [value]="settings?.retention" (onChange)="updateSetting('retention', $event)" />
		seconds
		<span class="relative-time">{{ utils.printDuration(settings?.retention, 'forever') }}</span>
	</dd>

	<dt>Default token expire time</dt>
	<dd>
		<app-inline-edit type="number" [value]="settings?.tokenTTL" (onChange)="updateSetting('tokenTTL', $event)" />
		seconds
		<span class="relative-time">{{ utils.printDuration(settings?.tokenTTL, 'never expires') }}</span>
	</dd>

	<dt>Allow public create user</dt>
	<dd>
		<app-inline-edit type="boolean" [value]="settings?.allowPublicCreateUser" (onChange)="updateSetting('allowPublicCreateUser', $event)" />
	</dd>

	<dt>Allow non-administrator login</dt>
	<dd>
		<app-inline-edit type="boolean" [value]="settings?.allowNonAdminLogin" (onChange)="updateSetting('allowNonAdminLogin', $event)" />
	</dd>
</dl>
