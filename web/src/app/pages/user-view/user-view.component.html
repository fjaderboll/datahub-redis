@if (auth.isAdmin()) {
	<app-breadcrumb [links]="['/users', '/users/' + username]" [names]="['Users', username]" />
} @else {
	<app-breadcrumb [links]="['/users/' + username]" [names]="[username]" />
}

<dl class="list">
	<dt>Username</dt>
	<dd>{{ user?.username }}</dd>

	<dt>E-mail</dt>
	<dd>
		<app-inline-edit type="text" [value]="user?.email" (onChange)="changedValue('email', $event)" />
	</dd>

	<dt>Administrator</dt>
	<dd>
		<app-inline-edit type="boolean" [value]="user?.isAdmin" (onChange)="changedValue('isAdmin', $event)" [disabled]="!auth.isAdmin()" />
	</dd>
</dl>

<div class="actions align-left margin-top">
	<button mat-raised-button color="primary" (click)="changePassword()">
		<mat-icon>password</mat-icon>
		<span>Change Password</span>
	</button>

	@if (auth.isAdmin() && !isSelf()) {
		<button mat-raised-button color="primary" (click)="impersonate()">
			<mat-icon>person</mat-icon>
			<span>Impersonate</span>
		</button>
	}

	<button mat-raised-button color="warn" (click)="deleteUser()">
		<mat-icon>delete</mat-icon>
		<span>Delete User</span>
	</button>
</div>
