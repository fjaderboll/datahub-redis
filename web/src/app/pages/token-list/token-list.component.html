<app-breadcrumb [links]="['/tokens']" [names]="['Tokens']" />

<div class="actions">
	<button mat-raised-button color="primary" (click)="createToken()">
		<mat-icon>add</mat-icon>
		<span>Create Token</span>
	</button>
</div>

@if (createdToken) {
	<div class="created-token margin-top" role="status">
		<div class="created-token-text">
			<strong>New token{{ createdToken.desc ? ' for ' + createdToken.desc : '' }}</strong><br/>
			Copy it now, it will not be shown again.
			<div class="full-token">
				<code>{{ createdToken.token }}</code>
				<button mat-icon-button [cdkCopyToClipboard]="createdToken.token" (cdkCopyToClipboardCopied)="copied()" aria-label="Copy token">
					<mat-icon>content_copy</mat-icon>
				</button>
			</div>
		</div>
		<button mat-icon-button (click)="createdToken = null" aria-label="Dismiss">
			<mat-icon>close</mat-icon>
		</button>
	</div>
}

<div class="table-container margin-top">
	<table mat-table [dataSource]="dataSource" matSort matSortActive="id" matSortDisableClear matSortDirection="asc">

		<ng-container matColumnDef="desc">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Description</th>
			<td mat-cell *matCellDef="let token">
				<app-inline-edit type="text" [value]="token.desc" (onChange)="changedValue(token, 'desc', $event)" />
			</td>
		</ng-container>

		<ng-container matColumnDef="enabled">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Enabled</th>
			<td mat-cell *matCellDef="let token">
				<app-inline-edit type="boolean" [value]="token.enabled" (onChange)="changedValue(token, 'enabled', $event)" />
			</td>
		</ng-container>

		<ng-container matColumnDef="token">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Token</th>
			<td mat-cell *matCellDef="let token"><code>{{ token.token }}</code></td>
		</ng-container>

		<ng-container matColumnDef="expire">
			<th mat-header-cell *matHeaderCellDef mat-sort-header>Expire</th>
			<td mat-cell *matCellDef="let token">
				<app-inline-edit
					type="number"
					[value]="utils.printTimestamp(token.expire)"
					placeholder="Never"
					[editValue]="getTTL(token)"
					hint="Seconds from now, 0 to never expire"
					(onChange)="changedValue(token, 'ttl', $event)"
				/>
				<span class="relative-time">{{ utils.getRelativeTime(token.expire) }}</span>
			</td>
		</ng-container>

		<ng-container matColumnDef="actions">
			<th mat-header-cell *matHeaderCellDef></th>
			<td mat-cell *matCellDef="let token">
				<button mat-button color="warn" (click)="deleteToken(token)">
					<mat-icon>delete</mat-icon>
					<span>Revoke</span>
				</button>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
	</table>

	<div [hidden]="dataSource.data.length <= 10">
		<mat-paginator [pageSizeOptions]="[10, 100]" />
	</div>
</div>
